[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vfr-transcoder"
version = "1.0.0"
description = "VFR (1/1000 time base, B-frame reorder) to CFR transcoder with copyts, resumable segments, HTTP API and worker pool"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "numpy>=1.24"]

[project.scripts]
vfr-transcoder = "vfr_transcoder.cli:main"

[tool.setuptools]
packages = ["vfr_transcoder"]
